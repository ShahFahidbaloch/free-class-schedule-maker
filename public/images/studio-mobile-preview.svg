<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .surface { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .header-bg { fill: #f1f5f9; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #64748b; }
      .card-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1; }
      .bar-blue { fill: #3b82f6; }
      .card-emerald { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1; }
      .bar-emerald { fill: #10b981; }
      .btn { rx: 10px; ry: 10px; fill: #0f172a; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <!-- Device Background -->
  <rect width="390" height="700" class="bg" rx="24" />

  <!-- Studio Mobile Header -->
  <rect x="16" y="16" width="358" height="54" class="surface" rx="14" />
  <circle cx="42" cy="43" r="12" fill="#0f172a" />
  <text x="42" y="47" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">FS</text>
  <text x="64" y="47" class="text-title">Schedule Studio</text>
  <rect x="290" y="28" width="70" height="30" rx="8" fill="#0f172a" />
  <text x="325" y="47" class="btn-text">+ Add</text>

  <!-- Plan Switcher Tabs -->
  <rect x="16" y="78" width="358" height="38" class="surface" rx="10" />
  <rect x="19" y="81" width="116" height="32" rx="8" fill="#0f172a" />
  <text x="77" y="101" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Plan A</text>
  <text x="195" y="101" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Plan B</text>
  <text x="313" y="101" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Plan C</text>

  <!-- Mobile Segmented Day Tabs (Mon - Sun) -->
  <g id="day-tabs">
    <!-- Mon active -->
    <rect x="16" y="124" width="46" height="34" rx="8" fill="#0f172a" />
    <text x="39" y="145" class="text-mono" text-anchor="middle" fill="#ffffff">Mon</text>

    <!-- Tue -->
    <rect x="68" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="91" y="145" class="text-mono" text-anchor="middle">Tue</text>

    <!-- Wed -->
    <rect x="120" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="143" y="145" class="text-mono" text-anchor="middle">Wed</text>

    <!-- Thu -->
    <rect x="172" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="195" y="145" class="text-mono" text-anchor="middle">Thu</text>

    <!-- Fri -->
    <rect x="224" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="247" y="145" class="text-mono" text-anchor="middle">Fri</text>

    <!-- Sat -->
    <rect x="276" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="299" y="145" class="text-mono" text-anchor="middle">Sat</text>

    <!-- Sun -->
    <rect x="328" y="124" width="46" height="34" rx="8" fill="#f1f5f9" />
    <text x="351" y="145" class="text-mono" text-anchor="middle">Sun</text>
  </g>

  <!-- Active Day Banner -->
  <rect x="16" y="168" width="358" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="30" y="191" class="text-title">Monday</text>
  <rect x="300" y="174" width="62" height="24" rx="12" fill="#e2e8f0" />
  <text x="331" y="190" class="text-mono" text-anchor="middle">2 Classes</text>

  <!-- Timeline Body -->
  <rect x="16" y="212" width="358" height="420" class="surface" rx="14" />

  <!-- Time column -->
  <text x="44" y="244" class="text-mono" text-anchor="middle">9:00 AM</text>
  <line x1="72" y1="212" x2="72" y2="632" class="grid-line" />
  <line x1="16" y1="250" x2="374" y2="250" class="grid-line" />

  <text x="44" y="324" class="text-mono" text-anchor="middle">10:00 AM</text>
  <line x1="16" y1="330" x2="374" y2="330" class="grid-line" />

  <text x="44" y="404" class="text-mono" text-anchor="middle">11:00 AM</text>
  <line x1="16" y1="410" x2="374" y2="410" class="grid-line" />

  <text x="44" y="484" class="text-mono" text-anchor="middle">12:00 PM</text>
  <line x1="16" y1="490" x2="374" y2="490" class="grid-line" />

  <text x="44" y="564" class="text-mono" text-anchor="middle">1:00 PM</text>

  <!-- Cards in full width single day column -->
  <!-- CS 301 -->
  <rect x="80" y="330" width="286" height="72" rx="10" class="card-blue" />
  <rect x="80" y="330" width="6" height="72" rx="3" class="bar-blue" />
  <text x="96" y="352" class="text-title" fill="#1e3a8a">CS 301</text>
  <text x="96" y="370" class="text-sub" fill="#1e40af">Data Structures &amp; Algorithms</text>
  <text x="96" y="390" class="text-mono" fill="#3b82f6">10:00 – 11:15 AM &bull; Turing Hall 101</text>

  <!-- MATH 21 -->
  <rect x="80" y="415" width="286" height="72" rx="10" class="card-emerald" />
  <rect x="80" y="415" width="6" height="72" rx="3" class="bar-emerald" />
  <text x="96" y="437" class="text-title" fill="#064e3b">MATH 21</text>
  <text x="96" y="455" class="text-sub" fill="#065f46">Calculus &amp; Analytic Geometry II</text>
  <text x="96" y="475" class="text-mono" fill="#059669">11:30 AM – 12:45 PM &bull; Quad 304</text>

  <!-- Bottom Floating Sticky Action Bar -->
  <rect x="30" y="642" width="330" height="46" rx="23" fill="#0f172a" />
  <text x="195" y="670" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">+ Add Class to Monday</text>
</svg>
